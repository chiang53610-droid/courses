# ─────────────────────────────────────────────────────────────
# 新手版說明：這是 promptfoo 的設定檔（YAML 格式）。
# - 以 # 開頭的是註解，promptfoo 會忽略它們。
# - 原課程使用的 Claude 3 模型都已停用，這裡已換成目前可用的模型：
#     claude-3-haiku-20240307    → claude-haiku-4-5
#     claude-3-5-sonnet-20240620 → claude-sonnet-4-6
#     claude-3-opus-20240229     → claude-opus-4-6
# - 執行方式：在這個資料夾裡打開終端機，輸入  npx promptfoo@latest eval
# ─────────────────────────────────────────────────────────────
description: Count mentions
prompts:
  - >-
    Write a short paragraph about {{topic}}. Make sure you mention {{topic}} exactly {{count}} times, no more or fewer. Only use lower case letters in your output.
providers:
  - anthropic:messages:claude-haiku-4-5
  - anthropic:messages:claude-sonnet-4-6
defaultTest:
  assert:
    - type: python
      value: file://count.py
tests:
  - vars:
      topic: sheep
      count: 3
  - vars:
      topic: fowl
      count: 2
  - vars:
      topic: gallows
      count: 4
  - vars:
      topic: tweezers
      count: 7
  - vars:
      topic: jeans
      count: 6

